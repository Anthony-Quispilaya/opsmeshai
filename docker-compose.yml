services:
  postgres:
    image: postgres:16-alpine
    container_name: opsmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsmesh
      POSTGRES_PASSWORD: opsmesh
      POSTGRES_DB: opsmesh
    ports:
      - "5432:5432"
    volumes:
      - opsmesh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmesh -d opsmesh"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  opsmesh-postgres-data:
